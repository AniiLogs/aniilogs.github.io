name: Auto-merge

# Turns on auto-merge (squash) for every pull request a team member opens, so it merges by itself once the required
# checks pass, without anyone having to remember the button (docs/working-together.md in AniiLogs/aLogs).
# Only for branches in this repository (pushing one takes write access): a PR from a stranger's fork is never set to
# merge itself. Draft PRs wait until they're marked ready. Nothing from the PR is checked out or run.

# A merge made by auto-merge is pushed with this workflow's own token, and GitHub starts no push workflows for that
# push. So once such a PR has merged, the "after-merge" job starts what main's push would have: Tests and the Pages
# deploy. (The API deploy, api.yml, is switched off in GitHub and is left out.)

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  enable:
    if: >-
      github.event.action != 'closed' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR" || echo "Auto-merge could not be turned on; use the PR's button."

  after-merge:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged &&
      github.event.pull_request.base.ref == 'main' &&
      contains(github.event.pull_request.merged_by.login, 'github-actions')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start main's push workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run tests.yml --ref main
          gh workflow run pages.yml --ref main
