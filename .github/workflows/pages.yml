name: Deploy the aniilogs.github.io forwarder to GitHub Pages

# The site itself is served from https://aniilogs.app by the Cloudflare Pages project (api.yml deploys public/ with the
# API). GitHub Pages keeps the old address as a forwarder: every page and every other address (404.html) sends the
# visitor to the same path, query and #fragment on https://aniilogs.app (scripts/build-github-forwarder.mjs).

# It runs once the site and API deploy (api.yml) has succeeded, so the old address only forwards to a site that is up.
on:
  workflow_run:
    workflows: ["Deploy AniiLogs API to Cloudflare Pages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install pinned validation dependencies
        run: npm ci
      - name: Verify reviewed release and deployment approval
        run: npm run release:deploy-check
      - name: Build the forwarder
        run: npm run forwarder:build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the forwarder
        uses: actions/upload-pages-artifact@v5
        with:
          path: .github-forwarder

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
