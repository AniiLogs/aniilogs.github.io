name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Repository boundary (no private files)
        run: npm run repo:validate
      - name: Release review pin matches public/ (else the Pages deploy refuses it after merging)
        run: npm run release:validate
